research_task:
  description: >
    Cari informasi mendalam tentang kompetitor bisnis di bidang {business_field}.
    Kumpulkan data berikut sebanyak mungkin:
    1. Daftar kompetitor utama beserta harga produk/layanan mereka
    2. Fitur-fitur unggulan yang ditawarkan setiap kompetitor
    3. Review negatif atau kelemahan yang sering dikeluhkan pelanggan
    4. Strategi pemasaran yang mereka gunakan

    ATURAN PENTING:
    - WAJIB GUNAKAN tools search_internet, scrape_website, dan deep_search
      untuk SETIAP informasi yang dikumpulkan.
    - Search tools mengembalikan data dalam format JSON yang dibungkus marker
      ---[SEARCH_RESULT]--- dan ---[/SEARCH_RESULT]---. Ambil data dari
      bagian "organic" pada JSON tersebut.
    - DILARANG KERAS membuat atau menciptakan URL palsu. HANYA gunakan URL
      yang benar-benar berasal dari output search tools.
    - DILARANG KERAS menebak-nebak atau membuat data tanpa benar-benar
      memanggil tools terlebih dahulu.
    - Setiap URL harus diverifikasi: jika search tool mengembalikan
      "url_valid": false untuk suatu URL, jangan gunakan URL tersebut.
    - Jika search tool gagal atau mengembalikan error, laporkan errornya
      dan jangan membuat data pengganti.
    - Catat URL sumber setiap informasi.
  expected_output: >
    Dokumen teks terstruktur berisi data mentah kompetitor: daftar kompetitor,
    harga, fitur, review negatif, dan sumber URL (hanya URL yang valid).
    Semua dalam Bahasa Indonesia.
  agent: researcher

analysis_task:
  description: >
    Berdasarkan data mentah dari Researcher, lakukan analisis berikut:
    1. Buat Analisis SWOT (Strengths, Weaknesses, Opportunities, Threats)
    untuk bisnis klien di bidang {business_field}
    2. Buat analisis Porter's Five Forces (Threat of New Entrants,
    Bargaining Power of Suppliers, Bargaining Power of Buyers,
    Threat of Substitutes, Industry Rivalry)
    3. Buat analisis PESTEL (Political, Economic, Social, Technological,
    Environmental, Legal) yang relevan
    4. Buat tabel perbandingan fitur dan harga antar kompetitor
    5. Berikan strategi positioning yang membedakan klien dari kompetitor
    6. Identifikasi celah pasar (market gap) yang bisa dimanfaatkan

    Gunakan data yang sudah dikumpulkan, jangan berasumsi tanpa data.
  expected_output: >
    Dokumen analisis yang mencakup SWOT matrix, Porter's Five Forces,
    PESTEL, tabel perbandingan kompetitor, strategi positioning, dan
    market gap. Semua dalam Bahasa Indonesia.
  agent: analyst

writing_task:
  description: >
    Berdasarkan hasil analisis dari Analyst, buat laporan akhir dalam format
    Markdown (.md) dengan struktur berikut:

    # Laporan Analisis Kompetitor — {business_field}

    ## 1. Ringkasan Eksekutif
    ## 2. Metodologi
    ## 3. Profil Kompetitor Utama
    ## 4. Perbandingan Fitur & Harga
    ## 5. Analisis SWOT
    ## 6. Porter's Five Forces
    ## 7. Analisis PESTEL
    ## 8. Strategi Positioning
    ## 9. Market Gap & Rekomendasi
    ## 10. Kesimpulan
    ## 11. Daftar Sumber (URL)

    Tulis dalam Bahasa Indonesia yang profesional, rapi, dan actionable.

    ATURAN PENTING:
    - Output harus berupa teks Markdown mentah, JANGAN dibungkus dengan
      triple backtick (```markdown ... ```) atau tag apapun.
    - Langsung tulis konten Markdown tanpa pembungkus.
    - Beri jarak baris kosong antar seksi agar rapi.
    - **URL SUMBER**: Setiap URL di bagian "Daftar Sumber" HARUS spesifik
      (halaman artikel, halaman produk, atau halaman spesifik lainnya).
      DILARANG mencantumkan homepage domain generik seperti tokopedia.com,
      shopee.co.id, tiktok.com, atau instagram.com sebagai sumber.
      Hanya gunakan URL yang benar-benar spesifik yang dihasilkan dari
      tool search_internet / deep_search.
  expected_output: >
    Teks Markdown mentah (tanpa pembungkus code block) berisi laporan
    analisis kompetitor yang lengkap, terstruktur, dan siap dipresentasikan.
    Semua dalam Bahasa Indonesia.
  agent: writer
