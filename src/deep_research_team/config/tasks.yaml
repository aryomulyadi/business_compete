research_task:
  description: >
    Cari informasi mendalam tentang kompetitor bisnis di bidang {business_field}.
    Kumpulkan data berikut:
    1. Daftar kompetitor utama — WAJIB maksimal 5 (LIMA) kompetitor terkuat
    2. Harga produk/layanan setiap kompetitor
    3. Fitur-fitur unggulan yang ditawarkan setiap kompetitor
    4. Review negatif atau kelemahan yang sering dikeluhkan pelanggan
    5. Strategi pemasaran yang mereka gunakan

    PRINSIP EVIDENCE-FIRST:
    - HANYA fakta yang benar-benar muncul di output search tools yang boleh ditulis.
    - Setiap fakta WAJIB diberi Evidence ID [E1], [E2], ... secara berurutan
      dan sumber URL asli dari hasil tool.
    - JANGAN pernah menebak, memperkirakan, atau menciptakan data yang tidak
      ada di hasil pencarian.

    URUTAN EKSEKUSI:
    - LANGKAH 1: Jalankan deep_search("{business_field}") untuk riset awal.
      Tool ini menjalankan 5 query pencarian paralel.
    - LANGKAH 2: Dari hasil Langkah 1, identifikasi kompetitor (whitelist) dan
      gunakan search_internet untuk query spesifik per kompetitor.
    - LANGKAH 3: Gunakan scrape_website untuk mengambil konten detail
      dari URL yang relevan.

    WHITELIST KOMPETITOR:
    - Hanya kompetitor yang BENAR-BENAR muncul di hasil search yang boleh
      dicantumkan. Jika hasil pencarian tidak menemukan 5 kompetitor,
      cantumkan jumlah yang ditemukan saja. DILARANG menambahkan nama
      kompetitor dari pengetahuan umum tanpa dukungan hasil pencarian.

    ATURAN PENTING:
    - WAJIB GUNAKAN tools search_internet, scrape_website, dan deep_search
      untuk SETIAP informasi yang dikumpulkan.
    - Search tools mengembalikan data dalam format JSON yang dibungkus marker
      ---[SEARCH_RESULT]--- dan ---[/SEARCH_RESULT]---. Ambil data dari
      bagian "organic" pada JSON tersebut.
    - DILARANG KERAS membuat atau menciptakan URL palsu. HANYA gunakan URL
      yang benar-benar berasal dari output search tools.
    - DILARANG KERAS menebak-nebak atau membuat data tanpa benar-benar
      memanggil tools terlebih dahulu.
    - Setiap URL harus diverifikasi: jika search tool mengembalikan
      "url_valid": false untuk suatu URL, jangan gunakan URL tersebut.
    - Jika search tool gagal atau mengembalikan error, laporkan errornya
      dan jangan membuat data pengganti.
    - Jika suatu data (misal harga) tidak ditemukan di hasil pencarian,
      tulis "Tidak ditemukan dalam hasil riset" — JANGAN mengisi dengan tebakan.
    - Kunci jumlah fakta: maksimal 3 fakta per kompetitor per kategori agar
      output tetap ringkas dan muat dalam batas token.

    FORMAT OUTPUT WAJIB (urutkan persis seperti ini):
    KOMPETITOR:
    [E#] Nama Kompetitor (Sumber: URL)
    ...

    PER KOMPETITOR (buat sub-bagian untuk setiap kompetitor):
    ### [Nama Kompetitor]
    - Harga: [E#] fakta harga (Sumber: URL)
    - Fitur: [E#] fakta fitur (Sumber: URL)
    - Review Negatif: [E#] fakta review (Sumber: URL)
    - Strategi: [E#] fakta strategi (Sumber: URL)

    TIDAK DIKETAHUI:
    [Data apa saja yang gagal ditemukan, ditulis sebagai daftar singkat]

    SUMBER:
    [Daftar URL valid yang benar-benar muncul di hasil tool, satu per baris]

    SELF-CHECK sebelum menyerahkan output:
    - Apakah setiap fakta memiliki Evidence ID dan URL dari hasil tool?
    - Apakah ada fakta, kompetitor, atau URL yang saya karang sendiri? Jika
      ada, hapus sekarang.
    - Apakah jumlah kompetitor tidak melebihi 5?
  expected_output: >
    Dokumen teks terstruktur berisi data mentah kompetitor: whitelist
    kompetitor (maksimal 5), harga, fitur, review negatif, dan sumber URL
    (hanya URL yang valid), semua diberi Evidence ID [E#]. Semua dalam
    Bahasa Indonesia.
  agent: researcher

analysis_task:
  description: |
    Berdasarkan data mentah dari Researcher, lakukan analisis berikut:
    1. Buat Analisis SWOT (Strengths, Weaknesses, Opportunities, Threats)
       untuk bisnis klien di bidang {business_field}
    2. Buat analisis Porter's Five Forces (Threat of New Entrants,
       Bargaining Power of Suppliers, Bargaining Power of Buyers,
       Threat of Substitutes, Industry Rivalry)
    3. Buat analisis PESTEL (Political, Economic, Social, Technological,
       Environmental, Legal) yang relevan
    4. Buat tabel perbandingan fitur dan harga antar kompetitor
       — minimal 3 dan maksimal 5 baris kompetitor
    5. Berikan strategi positioning yang membedakan klien dari kompetitor
    5a. Sarankan TEPAT 5 (LIMA) opsi nama brand strategis untuk
        {business_field}. Untuk SETIAP opsi, gunakan format WAJIB berikut
        (urutkan dari Opsi 1 sampai Opsi 5):

        **Opsi N: [NAMA BRAND]**
        - Makna Literal: [jelaskan arti setiap kata/suku kata]
        - Filosofi & Pesan: [pesan yang ingin disampaikan]
        - Target Pasar: [deskripsi demografi]
        - Positioning: [posisi pasar yang ingin dicapai]
        - Dasar Riset: [sebutkan Evidence ID [E#] dari data riset yang
          mendukung opsi ini; jika tidak ada, tulis "belum terverifikasi"]

        Contoh:
        **Opsi 1: DermaVerse**
        - Makna Literal: "Derma" (kulit) + "Verse" (semesta)
        - Filosofi & Pesan: ...
        - Target Pasar: ...
        - Positioning: ...
        - Dasar Riset: [E1], [E3]

    6. Identifikasi celah pasar (market gap) yang bisa dimanfaatkan

    PRINSIP EVIDENCE-BASED:
    - SETIAP poin dalam SWOT, Five Forces, PESTEL, positioning, dan market
      gap WAJIB menyertakan Evidence ID [E#] yang mendukungnya.
    - Klaim yang tidak memiliki data pendukung dari riset WAJIB ditandai
      "(asumsi)" — bukan ditulis sebagai fakta.
    - DILARANG memperkenalkan kompetitor, statistik, URL, atau fakta baru
      yang tidak ada di data riset.
    - Market gap harus diturunkan secara eksplisit dari tabel perbandingan
      fitur dan harga antar kompetitor.

    GUNANAKAN DATA yang sudah dikumpulkan, jangan berasumsi tanpa data.

    OUTPUT WAJIB: urutkan analisis sesuai nomor di atas (1-6). Jangan
    melewatkan satu pun. Setelah item 6, sertakan TABEL BUKTI sebagai
    bagian akhir output — WAJIB, jangan dilewati:

    ### TABEL BUKTI
    | Klaim | Evidence ID | Sumber URL |
    |---|---|---|
    | [klaim singkat] | [E#] | [URL] |

    TABEL BUKTI harus berisi minimal 5 baris yang memetakan klaim utama
    (SWOT, Five Forces, PESTEL, positioning, market gap) ke evidence aslinya.

    SELF-CHECK sebelum menyerahkan output:
    - Apakah setiap poin analisis memiliki Evidence ID?
    - Apakah ada klaim tanpa dukungan data yang tidak saya tandai "(asumsi)"?
    - Apakah saya menambahkan fakta/kompetitor/URL baru yang tidak ada di riset?
  expected_output: >
    Dokumen analisis yang mencakup SWOT matrix, Porter's Five Forces,
    PESTEL, tabel perbandingan kompetitor, strategi positioning, market gap,
    5 opsi nama brand dengan Dasar Riset, dan TABEL BUKTI. Semua dalam
    Bahasa Indonesia.
  agent: analyst

writing_task:
  description: >
    Berdasarkan hasil analisis dari Analyst, buat laporan akhir dalam format
    Markdown (.md) dengan struktur WAJIB berikut (TEPAT 12 seksi,
    judul seksi TIDAK BOLEH DIUBAH):

    # Laporan Analisis Kompetitor — {business_field}

    ## 1. Ringkasan Eksekutif
    ## 2. Metodologi
    ## 3. Profil Kompetitor Utama
    ## 4. Perbandingan Fitur & Harga
    ## 5. Analisis SWOT
    ## 6. Porter's Five Forces
    ## 7. Analisis PESTEL
    ## 8. Brand Strategy & Naming
      - Tepat 5 opsi nama brand (copas dari hasil Analyst)
    ## 9. Strategi Positioning
    ## 10. Market Gap & Rekomendasi
    ## 11. Kesimpulan
    ## 12. Daftar Sumber (URL)

    PRINSIP FAKTUAL:
    - HANYA meng-copy fakta dan Evidence ID [E#] dari hasil Analyst.
    - DILARANG KERAS menambah kompetitor, statistik, URL, atau fakta baru
      yang tidak ada di hasil Analyst.
    - Jika suatu data tidak tersedia di hasil analisis, tulis "Tidak tersedia
      dalam hasil riset" — jangan memperkirakan.
    - Setiap fakta penting di seksi 3-10 boleh menyertakan [E#] sebagai
      penanda jejak sumber.

    Tulis dalam Bahasa Indonesia yang profesional, rapi, dan actionable.

    ATURAN FORMAT:
    - Judul seksi HARUS persis seperti di atas (termasuk nomor dan tanda ##).
    - Jangan menambah atau menghapus seksi.
    - Panjang total laporan: 5.000-10.000 karakter.

    ATURAN PENTING:
    - Output harus berupa teks Markdown mentah, JANGAN dibungkus dengan
      triple backtick (```markdown ... ```) atau tag apapun.
    - Langsung tulis konten Markdown tanpa pembungkus.
    - Beri jarak baris kosong antar seksi agar rapi.
    - Seksi 8 "Brand Strategy & Naming" WAJIB meng-copy kelima opsi brand
      dari hasil Analyst secara verbatim (termasuk kolom Dasar Riset).
    - **URL SUMBER**: Setiap URL di bagian "Daftar Sumber" HARUS spesifik
      (halaman artikel, halaman produk, atau halaman spesifik lainnya).
      DILARANG mencantumkan homepage domain generik seperti tokopedia.com,
      shopee.co.id, tiktok.com, atau instagram.com sebagai sumber.
      Hanya gunakan URL yang benar-benar spesifik yang dihasilkan dari
      tool search_internet / deep_search.
    - WAJIB sertakan minimal 3 URL sumber yang valid.

    SELF-CHECK sebelum menyerahkan output:
    - Apakah saya menambahkan fakta/kompetitor/URL yang tidak ada di hasil
      Analyst? Jika ya, hapus sekarang.
    - Apakah kelima opsi brand di seksi 8 disalin verbatim dari Analyst?
    - Apakah semua 12 seksi ada dengan judul persis?

  expected_output: >
    Teks Markdown mentah (tanpa pembungkus code block) berisi laporan
    analisis kompetitor yang lengkap, terstruktur, dan siap dipresentasikan.
    Semua dalam Bahasa Indonesia.
  agent: writer
