[project]
name = "bizcomp-ai"
version = "0.1.0"
description = "BizComp AI — AI-powered competitor analysis"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.0",
    "crewai-tools>=1.15.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
    "markdown>=3.6",
    "streamlit>=1.35",
    "fpdf2>=2.8.0",
    "requests>=2.31",
    "openai>=1.0",
    "litellm>=1.50,<1.90",
    "pydantic>=2.0",
    "google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.8"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[project.scripts]
bizcomp-ai = "deep_research_team.main:run"
run_crew = "deep_research_team.main:run"
train = "deep_research_team.main:train"
replay = "deep_research_team.main:replay"
test = "deep_research_team.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_team"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["crewai.*", "litellm.*", "streamlit.*", "fpdf.*", "rich.*", "crewai_tools.*"]
ignore_missing_imports = true

[tool.crewai]
type = "crew"
