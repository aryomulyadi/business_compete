[project]
name = "deep-research-team"
version = "0.1.0"
description = "Deep Research Team using crewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.0",
    "crewai-tools>=1.15.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
deep-research-team = "deep_research_team.main:run"
run_crew = "deep_research_team.main:run"
train = "deep_research_team.main:train"
replay = "deep_research_team.main:replay"
test = "deep_research_team.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
