services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizcomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizcomp_password}
      POSTGRES_DB: ${POSTGRES_DB:-bizcomp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizcomp} -d ${POSTGRES_DB:-bizcomp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bizcomp}:${POSTGRES_PASSWORD:-bizcomp_password}@postgres:5432/${POSTGRES_DB:-bizcomp}
      BLOB_READ_WRITE_TOKEN: ""
    volumes:
      - output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn fastapi_backend.main:app --host 0.0.0.0 --port 8000 --workers 1

volumes:
  pgdata:
  output:
